# MageLite auf fly.io. Siehe docs/SERVER.md.
# Kosten: nur waehrend die Maschine laeuft (Auto-Stop); die Engine beendet sich selbst nach 10 min Leerlauf.

app = "magelite"
primary_region = "fra"

[build]

[env]
  MAGELITE_IDLE_EXIT_MIN = "10"
  MAGELITE_MAX_GAMES = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    # Der allererste Start baut die Karten-DB auf dem Volume (im Docker-Test 160 s), danach 2-6 s.
    grace_period = "420s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "performance-2x"
  memory = "4gb"

[mounts]
  source = "magelite_data"
  destination = "/data"
