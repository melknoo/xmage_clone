<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>MageLite</title>
    <style>
      /* Lokale Schriften (file://, ohne Bundler) - Kopien aus ui/node_modules/@fontsource */
      @font-face { font-family: "Barlow Condensed"; font-weight: 600; font-style: normal; src: url("fonts/barlow-condensed-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Barlow Condensed"; font-weight: 700; font-style: normal; src: url("fonts/barlow-condensed-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "IBM Plex Sans"; font-weight: 400; font-style: normal; src: url("fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2"); }

      html, body { height: 100%; margin: 0; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: #121110; color: #ece7de;
        font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .mark, .label { font-family: "Barlow Condensed", "Bahnschrift SemiCondensed", "Arial Narrow", sans-serif; text-transform: uppercase; line-height: 1; }
      .mark { font-weight: 700; font-size: 34px; letter-spacing: .08em; color: #ff7a3d; }
      .track { width: 240px; height: 2px; background: #2a2824; overflow: hidden; }
      /* Pseudo-Fortschritt: einmalig 0 -> 90 % ueber 20 s (keine Endlosschleife; Forge-Start dauert ca. 5-10 s) */
      .fill { width: 0; height: 100%; background: #ff7a3d; animation: fill 20s cubic-bezier(.2,.8,.2,1) forwards; }
      @keyframes fill { from { width: 0; } to { width: 90%; } }
      .label { font-weight: 600; font-size: 13px; letter-spacing: .12em; color: #9b958a; }
      .hint { margin: 0; font-size: 12.5px; line-height: 1.4; color: #6f6a62; }
      @media (prefers-reduced-motion: reduce) { .fill { animation: none; width: 30%; } }
    </style>
  </head>
  <body>
    <span class="mark">MageLite</span>
    <div class="track"><div class="fill"></div></div>
    <span class="label">Engine startet – Karten werden geladen …</span>
    <p class="hint">Die Kartenskripte werden bei jedem Start eingelesen (wenige Sekunden).</p>
  </body>
</html>
